[project]
name = "pat-jiandao-skill"
version = "0.8.3"
description = "Pat 剪刀 · AI 剪辑 skill：把手机录的中文口播剪成带中英字幕的成片"
requires-python = ">=3.12,<3.13"
dependencies = [
    # torchaudio 2.9 起 load() 改走 TorchCodec，和 FunASR 的兼容没核实，固定在 2.8.0
    "torch==2.8.0",
    "torchaudio==2.8.0",
    "funasr==1.4.16",
    "modelscope==1.40.1",
    "soundfile",
    "numpy",
    "pyyaml==6.0.3",
    "playwright==1.55.0",
    "pillow>=12.3.0",
    "pyjianyingdraft==0.3.1",
]

[tool.uv]
# 不加下限时 uv 会回退到 transformers 4.12，要现场编译 tokenizers（需要 Rust）
constraint-dependencies = ["transformers>=4.45"]
